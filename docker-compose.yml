version: "2"
      
services:
  redis:
    image: redis:alpine
    networks:
      - predots

  postgres:
    image: postgres:9.4
    networks:
      - predots

  queue:
    image: rabbitmq:latest
    networks:
      - predots

  web_wsgi:
    build: .
    depends_on:
      - queue
      - redis
      - postgres
    networks:
      - predots
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    command: gunicorn predots.wsgi:application --bind 0.0.0.0:8001 --log-level=DEBUG --timeout 200
    environment:
      DJANGO_SETTINGS_MODULE: predots.settings

  web_worker:
    build: .
    depends_on:
      - queue
      - redis
      - postgres
    networks:
      - predots
    volumes:
      - .:/code
    command: python manage.py runworker -v 2
    environment:
      DJANGO_SETTINGS_MODULE: predots.settings

  web_asgi:
    build: ./
    depends_on:
      - postgres
      - redis
      - queue
    networks:
      - predots
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: predots.settings

  worker:
    build: ./
    depends_on:
      - queue
      - postgres
      - redis
    networks:
      - predots
    volumes:
      - .:/code
    command: "celery worker --app=predots --concurrency=10 --autoscale=1,1"
    environment:
      DJANGO_SETTINGS_MODULE: predots.settings

  flower:
    build: ./
    depends_on:
      - queue
      - web_worker
      - web_asgi
    networks:
      - predots
    volumes:
      - .:/code
    ports:
      - "5555:5555"
    command: "celery flower -A predots --address=0.0.0.0"
    environment:
      DJANGO_SETTINGS_MODULE: predots.settings

networks:
  predots:
